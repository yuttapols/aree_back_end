spring:
  application:
    name: roti5dao-backend
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/roti5dao}
    username: ${DB_USERNAME:roti5dao}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # ห้าม update — schema มาจาก Flyway เท่านั้น
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mvc:
    problemdetails:
      enabled: false
  jackson:
    time-zone: UTC

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    whitelabel:
      enabled: false
  servlet:
    session:
      tracking-modes: []

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  default-produces-media-type: application/json
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    persist-authorization: true
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
    doc-expansion: none
    with-credentials: true

app:
  timezone: Asia/Bangkok
  cors:
    # คั่นด้วย comma — ต้องระบุ origin ชัดเจน ห้ามใช้ *
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  security:
    jwt:
      # base64 ของ key ยาวอย่างน้อย 32 byte — สร้างด้วย: openssl rand -base64 48
      secret: ${JWT_SECRET:}
      issuer: roti5dao
      audience: roti5dao-web
      access-token-ttl: 15m
      refresh-token-ttl: 14d
    refresh-cookie:
      name: r5d_rt
      path: /api/v1/auth
      secure: ${REFRESH_COOKIE_SECURE:true}
      same-site: Strict
    password:
      bcrypt-strength: 12
    login:
      max-failed-attempts: 5
      lock-duration: 15m
    rate-limit:
      enabled: true
  storage:
    local-dir: ${STORAGE_DIR:./storage}
    public-url-prefix: /files
    max-file-size: 5MB
  bootstrap:
    admin-phone: ${ROTI_ADMIN_PHONE:}
    admin-password: ${ROTI_ADMIN_PASSWORD:}
    admin-nickname: ${ROTI_ADMIN_NICKNAME:Admin}
  order:
    max-items-per-order: 50
    max-quantity-per-item: 99
    max-pending-slips-per-order: 3
