spring:
  config:
    # ค่าเฉพาะเครื่อง (DB, admin bootstrap ฯลฯ) อยู่ใน .env ที่ root — gitignored, ดูตัวอย่างที่ .env.example
    import: optional:file:.env[.properties]
  flyway:
    locations: classpath:db/migration,classpath:db/seed

app:
  security:
    refresh-cookie:
      # http://localhost ไม่ใช่ HTTPS — dev เท่านั้น
      secure: ${REFRESH_COOKIE_SECURE:false}

logging:
  level:
    com.roti5dao: DEBUG
